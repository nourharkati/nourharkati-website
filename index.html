<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Nour Harkati</title>
    <link rel="icon" type="image/png" href="icon.png" />

    <style>
      @font-face {
        font-family: "CygnitoMono";
        src: url("fonts/cygnito-mono-regular.otf") format("opentype");
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #d12b2b;
        color: #ffffff;
        font-family: "CygnitoMono", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        padding: 40px 20px 20px 20px;
        cursor: none;
        overflow-x: hidden;
        /* Strict global text selection block */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      a, button, input {
        cursor: none;
      }

      /* Custom Cursor - WHITE default, BLUE hover */
      .custom-cursor {
        position: fixed;
        width: 20px;
        height: 20px;
        background-color: #ffffff; /* WHITE */
        border-radius: 50%;
        pointer-events: none;
        z-index: 10000;
        transform: translate(-50%, -50%);
        transition: background-color 0.2s ease, transform 0.1s ease, opacity 0.2s ease;
        mix-blend-mode: difference;
        opacity: 0.85;
      }

      .custom-cursor.hovered {
        background-color: #5472cc; /* BLUE */
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0.7; /* Medium opacity on hover */
      }

      @media (hover: none) and (pointer: coarse) {
        .custom-cursor { display: none; }
        body, a, button, input { cursor: auto !important; }
      }

      .container {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }

      .logo-link {
        display: inline-block;
        text-decoration: none;
        transition: opacity 0.3s ease;
      }
      .logo-link:hover { opacity: 0.85; }

      .logo {
        display: block;
        max-width: 100%;
        height: auto;
        object-fit: contain;
        -webkit-user-drag: none;
      }
      .logo { max-width: 320px; width: 100%; }

      .links-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 24px;
        margin-top: 5px;
      }
      .nav-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 1px;
        text-transform: lowercase;
        transition: opacity 0.25s ease;
        opacity: 0.85;
        position: relative;
      }
      .nav-link:hover { opacity: 1; }
      .nav-link::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 1px;
        background: #ffffff;
        transition: width 0.3s ease;
      }
      .nav-link:hover::after { width: 100%; }

      .hello-gif {
        display: block;
        max-width: 400px;
        width: 100%;
        height: auto;
        object-fit: contain;
        -webkit-user-drag: none;
      }

      .image-fallback {
        width: 100%;
        height: 150px;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px dashed rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
        border-radius: 4px;
      }

      /* Newsletter - Updated Layout */
      .newsletter-form {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
        margin-top: 10px;
        width: 100%;
        max-width: 400px;
      }

      .newsletter-input {
        width: 100%;
        padding: 8px 0;
        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        background: transparent;
        color: #ffffff;
        font-family: "CygnitoMono", monospace;
        font-size: 0.75rem;
        outline: none;
        text-align: left;
        transition: border-bottom-color 0.3s ease;
      }
      .newsletter-input::placeholder { color: rgba(255, 255, 255, 0.5); }
      .newsletter-input:focus { border-bottom-color: #ffffff; }

      .newsletter-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 20px;
      }

      .newsletter-btn {
        padding: 6px 16px;
        border: 1px solid #ffffff;
        background: transparent;
        color: #ffffff;
        font-family: "CygnitoMono", monospace;
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: lowercase;
        transition: all 0.3s ease;
        flex-shrink: 0;
      }
      .newsletter-btn:hover:not(:disabled) {
        background: #ffffff;
        color: #d12b2b;
      }
      .newsletter-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      /* Countdown - STRETCHED and more breathable */
      .countdown {
        display: flex;
        gap: 30px; /* Increased gap */
        font-size: 0.8rem;
        letter-spacing: 1px;
        flex-shrink: 0;
      }
      .countdown-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.2;
        min-width: 50px; /* Ensures they don't squeeze */
      }
      .countdown-item span {
        font-size: 1rem;
        font-weight: bold;
      }
      .countdown-item small {
        font-size: 0.65rem;
        opacity: 0.7;
        text-transform: lowercase;
        margin-top: 3px;
      }

      .success-message {
        font-size: 0.8rem;
        letter-spacing: 1px;
        margin-top: 10px;
        animation: fadeIn 0.5s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .loading { opacity: 0; transition: opacity 0.5s ease; }
      .loaded { opacity: 1; }

      @media (max-width: 480px) {
        body { padding: 30px 15px 15px 15px; }
        .container { gap: 20px; }
        .logo { max-width: 240px; }
        .hello-gif { max-width: 300px; }
        .newsletter-form { max-width: 300px; }
        .links-container { gap: 16px 20px; }
        .nav-link { font-size: 0.75rem; }
        .newsletter-input { font-size: 16px; }
        
        /* Stack countdown below button on very small screens */
        .newsletter-bottom {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }
        .countdown {
          width: 100%;
          justify-content: flex-start;
          gap: 20px;
        }
      }
      @media (max-width: 360px) {
        .logo { max-width: 200px; }
        .hello-gif { max-width: 250px; }
        .newsletter-form { max-width: 250px; }
      }
    </style>
  </head>
  <body>
    <div class="custom-cursor" id="customCursor"></div>

    <div class="container">
      <a href="https://nourharkati.net/" class="logo-link clickable" aria-label="Home">
        <img
          src="img/logo.png"
          alt="Nour Harkati"
          class="logo loading"
          id="logo"
          draggable="false"
          onload="this.classList.add('loaded')"
          onerror="this.style.display = 'none'; this.nextElementSibling.style.display = 'flex';"
        />
      </a>

      <div class="links-container">
        <a href="https://nourharkati.bandcamp.com/" target="_blank" rel="noopener noreferrer" class="nav-link clickable">bandcamp</a>
        <a href="https://bnds.us/ns320u" target="_blank" rel="noopener noreferrer" class="nav-link clickable">shows</a>
        <a href="https://www.youtube.com/watch?v=o9s17K4tXbk" target="_blank" rel="noopener noreferrer" class="nav-link clickable">kexp</a>
        <a href="https://www.instagram.com/nour.harkati/" target="_blank" rel="noopener noreferrer" class="nav-link clickable">social</a>
        <a href="mailto:dgaar@atomicmusicgroup.com" class="nav-link clickable">booking</a>
      </div>

      <img
        src="img/hello.gif"
        alt="Animation"
        class="hello-gif loading"
        id="helloGif"
        draggable="false"
        onload="this.classList.add('loaded')"
        onerror="this.style.display = 'none'; this.nextElementSibling.style.display = 'flex';"
      />
      <div class="image-fallback" style="display: none">[ animation ]</div>

      <!-- NEWSLETTER FORM with Stretched Countdown -->
      <form class="newsletter-form" id="newsletterForm" action="https://formsubmit.co/nour.harkati@gmail.com" method="POST">
        <input type="text" name="_honey" style="display: none" />
        <input type="hidden" name="_captcha" value="false" />

        <input
          type="text"
          name="name"
          placeholder="name"
          class="newsletter-input clickable"
          required
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          data-lpignore="true"
        />
        <input
          type="email"
          name="email"
          placeholder="email"
          class="newsletter-input clickable"
          required
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          data-lpignore="true"
        />
        
        <div class="newsletter-bottom">
          <button type="submit" class="newsletter-btn clickable" id="submitBtn">
            subscribe
          </button>
          
          <div class="countdown">
            <div class="countdown-item">
              <span id="days">00</span><small>days</small>
            </div>
            <div class="countdown-item">
              <span id="hours">00</span><small>hrs</small>
            </div>
            <div class="countdown-item">
              <span id="minutes">00</span><small>min</small>
            </div>
            <div class="countdown-item">
              <span id="seconds">00</span><small>sec</small>
            </div>
          </div>
        </div>
      </form>
    </div>

    <script>
      // ===== STRICT SECURITY DETERRENTS =====
      // Disable right-click context menu globally
      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      // Disable dragging images
      document.querySelectorAll("img").forEach((img) => {
        img.addEventListener("dragstart", (event) => event.preventDefault());
      });

      // Disable keyboard shortcuts for Inspect/View Source (F12, Ctrl+U, etc.)
      document.addEventListener("keydown", function (e) {
        if (
          e.key === "F12" ||
          (e.ctrlKey && e.shiftKey && e.key === "I") ||
          (e.ctrlKey && e.key === "u") ||
          (e.metaKey && e.altKey && e.key === "I")
        ) {
          e.preventDefault();
        }
      });

      // ===== CUSTOM CURSOR =====
      const cursor = document.getElementById("customCursor");
      const isTouchDevice = window.matchMedia("(hover: none) and (pointer: coarse)").matches;

      if (!isTouchDevice && cursor) {
        document.addEventListener("mousemove", (e) => {
          cursor.style.left = `${e.clientX}px`;
          cursor.style.top = `${e.clientY}px`;
        });
        document.addEventListener("mouseover", (e) => {
          if (e.target.closest("a, button, input, .clickable")) {
            cursor.classList.add("hovered");
          }
        });
        document.addEventListener("mouseout", (e) => {
          if (e.target.closest("a, button, input, .clickable")) {
            cursor.classList.remove("hovered");
          }
        });
        document.addEventListener("mouseleave", () => {
          cursor.style.opacity = "0";
        });
        document.addEventListener("mouseenter", () => {
          cursor.style.opacity = "0.85";
        });
      } else if (cursor) {
        cursor.style.display = "none";
      }

      // ===== COUNTDOWN =====
      function updateCountdown() {
        try {
          const now = new Date();
          let targetYear = now.getFullYear();
          let targetDate = new Date(targetYear, 3, 27, 0, 0, 0);
          if (now > targetDate) targetDate = new Date(targetYear + 1, 3, 27, 0, 0, 0);
          const diff = targetDate - now;
          if (diff > 0) {
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            const daysEl = document.getElementById("days");
            const hoursEl = document.getElementById("hours");
            const minutesEl = document.getElementById("minutes");
            const secondsEl = document.getElementById("seconds");
            
            if (daysEl) daysEl.innerText = String(days).padStart(2, "0");
            if (hoursEl) hoursEl.innerText = String(hours).padStart(2, "0");
            if (minutesEl) minutesEl.innerText = String(minutes).padStart(2, "0");
            if (secondsEl) secondsEl.innerText = String(seconds).padStart(2, "0");
          }
        } catch (error) {
          console.error("Countdown error:", error);
        }
      }
      updateCountdown();
      setInterval(updateCountdown, 1000);

      // ===== IMAGE PRELOADING =====
      window.addEventListener("load", () => {
        const logo = document.getElementById("logo");
        const helloGif = document.getElementById("helloGif");
        if (logo && logo.complete) logo.classList.add("loaded");
        if (helloGif && helloGif.complete) helloGif.classList.add("loaded");
      });

      // ===== SMOOTH SCROLL =====
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", function (e) {
          const href = this.getAttribute("href");
          if (href !== "#") {
            e.preventDefault();
            const target = document.querySelector(href);
            if (target) target.scrollIntoView({ behavior: "smooth" });
          }
        });
      });

      // ===== NEWSLETTER SUBMISSION =====
      const form = document.getElementById("newsletterForm");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const originalText = submitBtn.innerText;
        submitBtn.innerText = "sending...";
        submitBtn.disabled = true;
        const formData = new FormData(form);

        fetch(form.action, {
          method: "POST",
          body: formData,
          headers: { Accept: "application/json" },
        })
          .then((response) => {
            if (response.ok) {
              form.innerHTML = '<p class="success-message">thank you for subscribing.</p>';
            } else {
              submitBtn.innerText = originalText;
              submitBtn.disabled = false;
              alert("oops, something went wrong. please try again.");
            }
          })
          .catch((error) => {
            console.error("Formsubmit error:", error);
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
            alert("oops, something went wrong. please try again.");
          });
      });
    </script>
  </body>
</html>
