<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Nour Harkati</title>
    <link rel="icon" type="image/png" href="icon.png" />

    <style>
      @font-face {
        font-family: "CygnitoMono";
        src: url("fonts/cygnito-mono-regular.otf") format("opentype");
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #d12b2b;
        color: #ffffff;
        font-family: "CygnitoMono", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 20px;
        cursor: none;
        overflow-x: hidden;
      }

      a,
      button,
      input {
        cursor: none;
      }

      /* Custom Cursor */
      .custom-cursor {
        position: fixed;
        width: 20px;
        height: 20px;
        background-color: #ffffff;
        border-radius: 50%;
        pointer-events: none;
        z-index: 10000;
        transform: translate(-50%, -50%);
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
        mix-blend-mode: difference;
      }

      .custom-cursor.hovered {
        background-color: #5472cc;
        transform: translate(-50%, -50%) scale(1.5);
      }

      /* Hide cursor on touch devices */
      @media (hover: none) and (pointer: coarse) {
        .custom-cursor {
          display: none;
        }
        body,
        a,
        button,
        input {
          cursor: auto !important;
        }
      }

      .container {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }

      /* Images - With fallbacks */
      .logo-link {
        display: inline-block;
        text-decoration: none;
        transition: opacity 0.3s ease;
      }

      .logo-link:hover {
        opacity: 0.85;
      }

      .logo,
      .hello-gif {
        display: block;
        max-width: 100%;
        height: auto;
        object-fit: contain;
      }

      .logo {
        max-width: 320px;
        width: 100%;
      }

      .hello-gif {
        max-width: 400px;
        width: 100%;
      }

      /* Fallback for missing images */
      .image-fallback {
        width: 100%;
        height: 150px;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px dashed rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
        border-radius: 4px;
      }

      /* Countdown */
      .countdown {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        font-size: 0.85rem;
        letter-spacing: 1px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .countdown-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.2;
        min-width: 50px;
      }

      .countdown-item span {
        font-size: 1.1rem;
        font-weight: bold;
      }

      .countdown-item small {
        font-size: 0.65rem;
        opacity: 0.7;
        text-transform: lowercase;
        margin-top: 4px;
      }

      /* Newsletter */
      .newsletter-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 5px; /* Brought closer to countdown */
        width: 100%;
        max-width: 280px;
      }

      .newsletter-input {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        background: transparent;
        color: #ffffff;
        font-family: "CygnitoMono", monospace;
        font-size: 0.75rem;
        outline: none;
        text-align: left; /* Left-aligned text */
        transition: border-bottom-color 0.3s ease;
      }

      .newsletter-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .newsletter-input:focus {
        border-bottom-color: #ffffff;
      }

      .newsletter-btn {
        padding: 6px 16px;
        border: 1px solid #ffffff;
        background: transparent;
        color: #ffffff;
        font-family: "CygnitoMono", monospace;
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: lowercase;
        transition: all 0.3s ease;
        min-width: 100px;
        margin-top: 5px;
      }

      .newsletter-btn:hover:not(:disabled) {
        background: #ffffff;
        color: #d12b2b;
      }

      .newsletter-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .success-message {
        font-size: 0.8rem;
        letter-spacing: 1px;
        margin-top: 10px;
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Links / Menu */
      .links-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 24px;
        margin-top: 10px;
      }

      .nav-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 1px;
        text-transform: lowercase;
        transition: opacity 0.25s ease;
        opacity: 0.85;
        position: relative;
      }

      .nav-link:hover {
        opacity: 1;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 1px;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      .nav-link:hover::after {
        width: 100%;
      }

      /* Loading state */
      .loading {
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      .loaded {
        opacity: 1;
      }

      /* Mobile */
      @media (max-width: 480px) {
        body {
          padding: 30px 15px;
        }

        .container {
          gap: 20px;
        }

        .logo {
          max-width: 240px;
        }

        .hello-gif {
          max-width: 300px;
        }

        .countdown {
          gap: 15px;
          font-size: 0.75rem;
        }

        .countdown-item span {
          font-size: 0.95rem;
        }

        .newsletter-form {
          max-width: 100%;
        }

        .links-container {
          gap: 16px 20px;
        }

        .nav-link {
          font-size: 0.75rem;
        }

        /* FIX: Prevents iOS Safari from auto-zooming on input focus */
        .newsletter-input {
          font-size: 16px;
        }
      }

      /* Very small screens */
      @media (max-width: 360px) {
        .logo {
          max-width: 200px;
        }

        .hello-gif {
          max-width: 250px;
        }

        .countdown {
          gap: 12px;
        }

        .countdown-item {
          min-width: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="custom-cursor" id="customCursor"></div>

    <div class="container">
      <!-- 1. LOGO -->
      <a
        href="https://nourharkati.net/"
        class="logo-link clickable"
        aria-label="Home"
      >
        <img
          src="img/logo.png"
          alt="Nour Harkati"
          class="logo loading"
          id="logo"
          onload="this.classList.add('loaded')"
          onerror="
            this.style.display = 'none';
            this.nextElementSibling.style.display = 'flex';
          "
        />
        <div class="image-fallback" style="display: none">NOUR HARKATI</div>
      </a>

      <!-- 2. MENU -->
      <div class="links-container">
        <a
          href="https://nourharkati.bandcamp.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="nav-link clickable"
          >music</a
        >
        <a
          href="https://bnds.us/ns320u"
          target="_blank"
          rel="noopener noreferrer"
          class="nav-link clickable"
          >shows</a
        >
        <a
          href="https://www.youtube.com/watch?v=o9s17K4tXbk"
          target="_blank"
          rel="noopener noreferrer"
          class="nav-link clickable"
          >kexp</a
        >
        <a
          href="https://nourharkati.bandcamp.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="nav-link clickable"
          >social</a
        >
        <a
          href="mailto:dgaar@atomicmusicgroup.com"
          target="_blank"
          rel="noopener noreferrer"
          class="nav-link clickable"
          >booking</a
        >
      </div>

      <!-- 3. HELLO GIF -->
      <img
        src="img/hello.gif"
        alt="Animation"
        class="hello-gif loading"
        id="helloGif"
        onload="this.classList.add('loaded')"
        onerror="
          this.style.display = 'none';
          this.nextElementSibling.style.display = 'flex';
        "
      />
      <div class="image-fallback" style="display: none">[ animation ]</div>

      <!-- 4. COUNTDOWN -->
      <div class="countdown">
        <div class="countdown-item">
          <span id="days">00</span>
          <small>days</small>
        </div>
        <div class="countdown-item">
          <span id="hours">00</span>
          <small>hrs</small>
        </div>
        <div class="countdown-item">
          <span id="minutes">00</span>
          <small>min</small>
        </div>
        <div class="countdown-item">
          <span id="seconds">00</span>
          <small>sec</small>
        </div>
      </div>

      <!-- 5. NEWSLETTER FORM -->
      <form class="newsletter-form" id="newsletterForm">
        <!-- Anti-spam honeypot -->
        <input type="text" name="_honey" style="display: none" />

        <!-- Name Input -->
        <input
          type="text"
          name="name"
          placeholder="name"
          class="newsletter-input clickable"
          required
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          data-lpignore="true"
        />

        <!-- Email Input -->
        <input
          type="email"
          name="email"
          placeholder="email"
          class="newsletter-input clickable"
          required
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          data-lpignore="true"
        />

        <button type="submit" class="newsletter-btn clickable" id="submitBtn">
          subscribe
        </button>
      </form>
    </div>

    <script>
      // Custom Cursor with better touch detection
      const cursor = document.getElementById("customCursor");
      const isTouchDevice = window.matchMedia(
        "(hover: none) and (pointer: coarse)",
      ).matches;

      if (!isTouchDevice && cursor) {
        document.addEventListener("mousemove", (e) => {
          cursor.style.left = `${e.clientX}px`;
          cursor.style.top = `${e.clientY}px`;
        });

        document.addEventListener("mouseover", (e) => {
          if (e.target.closest("a, button, input, .clickable")) {
            cursor.classList.add("hovered");
          }
        });

        document.addEventListener("mouseout", (e) => {
          if (e.target.closest("a, button, input, .clickable")) {
            cursor.classList.remove("hovered");
          }
        });

        document.addEventListener("mouseleave", () => {
          cursor.style.opacity = "0";
        });

        document.addEventListener("mouseenter", () => {
          cursor.style.opacity = "1";
        });
      } else if (cursor) {
        cursor.style.display = "none";
      }

      // Countdown with error handling
      function updateCountdown() {
        try {
          const now = new Date();
          let targetYear = now.getFullYear();
          let targetDate = new Date(targetYear, 3, 27, 0, 0, 0); // April 27

          if (now > targetDate) {
            targetDate = new Date(targetYear + 1, 3, 27, 0, 0, 0);
          }

          const diff = targetDate - now;

          if (diff > 0) {
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor(
              (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
            );
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const daysEl = document.getElementById("days");
            const hoursEl = document.getElementById("hours");
            const minutesEl = document.getElementById("minutes");
            const secondsEl = document.getElementById("seconds");

            if (daysEl) daysEl.innerText = String(days).padStart(2, "0");
            if (hoursEl) hoursEl.innerText = String(hours).padStart(2, "0");
            if (minutesEl)
              minutesEl.innerText = String(minutes).padStart(2, "0");
            if (secondsEl)
              secondsEl.innerText = String(seconds).padStart(2, "0");
          }
        } catch (error) {
          console.error("Countdown error:", error);
        }
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);

      // Preload images for better performance
      window.addEventListener("load", () => {
        const logo = document.getElementById("logo");
        const helloGif = document.getElementById("helloGif");

        if (logo && logo.complete) logo.classList.add("loaded");
        if (helloGif && helloGif.complete) helloGif.classList.add("loaded");
      });

      // Smooth scroll for anchor links
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", function (e) {
          const href = this.getAttribute("href");
          if (href !== "#") {
            e.preventDefault();
            const target = document.querySelector(href);
            if (target) {
              target.scrollIntoView({ behavior: "smooth" });
            }
          }
        });
      });

      // ===== NEWSLETTER FORM SUBMISSION (Google Sheet) =====
      const form = document.getElementById("newsletterForm");
      const submitBtn = document.getElementById("submitBtn");

      // Full, correct Google Apps Script URL
      const scriptURL =
        "https://script.google.com/macros/s/AKfycbz9lfc8QcMujHTv3qyIIFZ2O9vS16lcnpytVejdXFEYo_7UNekhKyLBu_9j4KcOSJCF/exec";

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const originalText = submitBtn.innerText;
        submitBtn.innerText = "sending...";
        submitBtn.disabled = true;

        const formData = new FormData(form);

        // Convert to URL-encoded format (Guarantees Google reads name & email correctly)
        const urlEncodedData = new URLSearchParams(formData).toString();

        fetch(scriptURL, {
          method: "POST",
          body: urlEncodedData,
          mode: "no-cors",
        })
          .then(() => {
            form.innerHTML =
              '<p class="success-message">thank you for subscribing.</p>';
          })
          .catch((error) => {
            console.error("Error:", error);
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
            alert("oops, something went wrong. please try again.");
          });
      });
    </script>
  </body>
</html>
